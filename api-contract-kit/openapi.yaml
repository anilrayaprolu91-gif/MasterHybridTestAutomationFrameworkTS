openapi: 3.0.3
info:
  title: Deterministic User API
  version: 1.0.0
  description: Small contract-first API used to demonstrate deterministic Playwright API testing.
servers:
  - url: http://127.0.0.1:4010
paths:
  /users/{userId}:
    get:
      operationId: getUser
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            pattern: '^USR-[0-9]{4}$'
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /users:
    post:
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    User:
      type: object
      additionalProperties: false
      required: [id, name, role, active]
      properties:
        id:
          type: string
          pattern: '^USR-[0-9]{4}$'
        name:
          type: string
          minLength: 1
        role:
          type: string
          enum: [admin, user, viewer]
        active:
          type: boolean
    CreateUserRequest:
      type: object
      additionalProperties: false
      required: [name, role]
      properties:
        name:
          type: string
          minLength: 1
        role:
          type: string
          enum: [admin, user, viewer]
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
